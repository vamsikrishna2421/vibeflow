name: Build macOS app (Intel + Apple Silicon)

# Produces BOTH architectures so any Mac can run it — WITHOUT depending on GitHub's
# scarce/retiring Intel (macos-13) runners. Both jobs run on Apple Silicon (macos-14):
#   • arm64  — native.
#   • x86_64 — cross-built with an x64 Python running under Rosetta 2.
# Push a `mac-v*` tag → both zips are attached to that GitHub Release.
# Or trigger manually (workflow_dispatch) → both zips as downloadable artifacts.

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch: {}

permissions:
  contents: write        # create/upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  py_arch: arm64 }   # native on Apple Silicon
          - { arch: x86_64, py_arch: x64 }     # cross-built via Rosetta 2
    runs-on: macos-14      # Apple Silicon — reliable; Intel runners are being retired
    name: build-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (for the x86_64 cross-build)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.py_arch }}   # x64 → an x86_64 interpreter (runs under Rosetta)

      - name: Confirm Python architecture
        run: |
          M=$(python -c "import platform; print(platform.machine())")
          echo "python arch = $M  (want ${{ matrix.arch }})"
          test "$M" = "${{ matrix.arch }}"       # fail early if the wrong interpreter was provisioned

      - name: Create venv + install deps (arch-matched wheels)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build the .app (PyInstaller follows the venv's arch)
        run: bash scripts/build_mac_app.sh

      - name: Verify the built binary is the expected arch
        run: |
          BIN="release/VibeFlow.app/Contents/MacOS"
          F="$(ls "$BIN" | head -1)"
          echo "built arch: $(lipo -archs "$BIN/$F")"
          lipo -archs "$BIN/$F" | grep -qw "${{ matrix.arch }}"

      - name: Zip the app (arch-labelled)
        run: |
          ditto -c -k --keepParent "release/VibeFlow.app" "Mynah-mac-${{ matrix.arch }}.zip"
          ls -lh "Mynah-mac-${{ matrix.arch }}.zip"

      - name: Upload build artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: Mynah-mac-${{ matrix.arch }}
          path: Mynah-mac-${{ matrix.arch }}.zip

      - name: Attach to the GitHub Release (on a mac-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Mynah-mac-${{ matrix.arch }}.zip
