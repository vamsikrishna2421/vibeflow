name: Build macOS app (Intel + Apple Silicon)

# Produces BOTH architectures so any Mac can run it — WITHOUT depending on GitHub's
# scarce/retiring Intel (macos-13) runners. Both jobs run on Apple Silicon (macos-14):
#   • arm64  — native.
#   • x86_64 — the ENTIRE toolchain (venv, pip, PyInstaller) runs under `arch -x86_64`
#              via Rosetta 2, so uname/pip/PyInstaller all resolve to Intel and fetch
#              x86_64 wheels. (The setup-python "x64" build is universal2, so without the
#              arch wrapper it would run its arm64 slice natively and build arm64.)
# Push a `mac-v*` tag → both zips are attached to that GitHub Release.

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  py_arch: arm64, wrap: '' }
          - { arch: x86_64, py_arch: x64,   wrap: 'arch -x86_64' }
    runs-on: macos-14      # Apple Silicon — reliable; Intel runners are being retired
    name: build-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (for the x86_64 cross-build)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.py_arch }}

      - name: Confirm effective build architecture
        run: |
          M=$(${{ matrix.wrap }} python -c "import platform; print(platform.machine())")
          echo "effective arch = $M  (want ${{ matrix.arch }})"
          test "$M" = "${{ matrix.arch }}"

      - name: Create venv + install deps (arch-matched wheels)
        run: |
          ${{ matrix.wrap }} python -m venv .venv
          ${{ matrix.wrap }} .venv/bin/python -m pip install --upgrade pip
          ${{ matrix.wrap }} .venv/bin/python -m pip install -r requirements.txt

      - name: Build the .app (under the target arch)
        run: ${{ matrix.wrap }} bash scripts/build_mac_app.sh

      - name: Verify the built binary is the expected arch
        run: |
          BIN="release/VibeFlow.app/Contents/MacOS"
          F="$(ls "$BIN" | head -1)"
          echo "built arch: $(lipo -archs "$BIN/$F")"
          lipo -archs "$BIN/$F" | grep -qw "${{ matrix.arch }}"

      - name: Zip the app (arch-labelled)
        run: |
          ditto -c -k --keepParent "release/VibeFlow.app" "VibeFlow-mac-${{ matrix.arch }}.zip"
          ls -lh "VibeFlow-mac-${{ matrix.arch }}.zip"

      - name: Upload build artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: VibeFlow-mac-${{ matrix.arch }}
          path: VibeFlow-mac-${{ matrix.arch }}.zip

      - name: Attach to the GitHub Release (on a mac-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VibeFlow-mac-${{ matrix.arch }}.zip
