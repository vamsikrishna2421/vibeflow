name: Build macOS app (Intel + Apple Silicon)

# Produces BOTH architectures so any Mac can run it — WITHOUT depending on GitHub's
# scarce/retiring Intel (macos-13) runners. Both jobs run on Apple Silicon (macos-14):
#   • arm64  — native.
#   • x86_64 — the ENTIRE toolchain (venv, pip, PyInstaller) runs under `arch -x86_64`
#              via Rosetta 2, so uname/pip/PyInstaller all resolve to Intel and fetch
#              x86_64 wheels. (The setup-python "x64" build is universal2, so without the
#              arch wrapper it would run its arm64 slice natively and build arm64.)
# Push a `mac-v*` tag → both zips are attached to that GitHub Release.

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  py_arch: arm64, wrap: '' }
          - { arch: x86_64, py_arch: x64,   wrap: 'arch -x86_64' }
    runs-on: macos-14      # Apple Silicon — reliable; Intel runners are being retired
    name: build-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (for the x86_64 cross-build)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.py_arch }}

      - name: Confirm effective build architecture
        run: |
          M=$(${{ matrix.wrap }} python -c "import platform; print(platform.machine())")
          echo "effective arch = $M  (want ${{ matrix.arch }})"
          test "$M" = "${{ matrix.arch }}"

      - name: Stamp __version__ from the tag (so the build's version == the release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V="${GITHUB_REF_NAME#mac-v}"    # mac-v1.16.7 → 1.16.7
          python - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]; p = "src/vibeflow/__init__.py"
          s = re.sub(r'__version__ = "[^"]*"', f'__version__ = "{v}"', open(p).read())
          open(p, "w").write(s); print("stamped __version__ =", v)
          PY

      - name: Create venv + install deps (arch-matched wheels)
        run: |
          ${{ matrix.wrap }} python -m venv .venv
          ${{ matrix.wrap }} .venv/bin/python -m pip install --upgrade pip
          ${{ matrix.wrap }} .venv/bin/python -m pip install -r requirements.txt

      - name: Install offline-AI runtime (best-effort — never fail the build)
        run: |
          # llama-cpp-python powers the optional "Offline — no Ollama" tier. Try a
          # prebuilt CPU wheel first, then plain PyPI (compile). If neither works on
          # this arch, warn and continue — the offline tier just stays unavailable,
          # and the app degrades gracefully (offline_cleanup + spec both tolerate it).
          ${{ matrix.wrap }} .venv/bin/python -m pip install "llama-cpp-python>=0.3.0" \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            || ${{ matrix.wrap }} .venv/bin/python -m pip install "llama-cpp-python>=0.3.0" \
            || echo "::warning::llama-cpp-python unavailable on ${{ matrix.arch }} — offline AI tier disabled in this build"

      - name: Build the .app (under the target arch)
        run: ${{ matrix.wrap }} bash scripts/build_mac_app.sh

      - name: Verify the built binary is the expected arch
        run: |
          BIN="release/VibeFlow.app/Contents/MacOS"
          F="$(ls "$BIN" | head -1)"
          echo "built arch: $(lipo -archs "$BIN/$F")"
          lipo -archs "$BIN/$F" | grep -qw "${{ matrix.arch }}"

      # ── Sign + notarize (Developer ID). Both steps NO-OP gracefully when the
      #    secrets are absent, so the build still works before they're configured.
      #    Secrets: MAC_CERT_P12_BASE64, MAC_CERT_P12_PASSWORD (signing);
      #    MAC_NOTARY_APPLE_ID, MAC_NOTARY_TEAM_ID, MAC_NOTARY_PASSWORD (notarize).
      - name: Sign with Developer ID
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "::warning::No MAC_CERT_P12_BASE64 secret — shipping UNSIGNED (ad-hoc) build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/vibeflow-signing.keychain-db"
          KP="ci-$RANDOM$RANDOM"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$MAC_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/devid.p12"
          ID="Developer ID Application"
          APP="release/VibeFlow.app"
          # Sign every nested Mach-O inside-out, then the bundle with entitlements + hardened runtime.
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) | while read -r f; do
            file "$f" | grep -q "Mach-O" && codesign --force --options runtime --timestamp -s "$ID" "$f" >/dev/null 2>&1 || true
          done
          codesign --force --options runtime --timestamp --entitlements packaging/entitlements.mac.plist -s "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✓ signed with Developer ID"

      # Best-effort + self-diagnosing. Notarization must NEVER fail the ship: a
      # SIGNED build already runs (the in-app auto-updater swaps files itself, so
      # Gatekeeper doesn't re-check on update; only a fresh *browser* download needs
      # a one-time right-click→Open until it's notarized). If notarization isn't
      # "Accepted", we fetch `notarytool log` so the EXACT rejection reason (bad
      # credentials vs a specific binary/entitlement) prints right here in the run.
      - name: Notarize + staple (best-effort)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          set +e
          if [ -z "$MAC_NOTARY_PASSWORD" ] || [ -z "$MAC_NOTARY_APPLE_ID" ] || [ -z "$MAC_NOTARY_TEAM_ID" ]; then
            echo "::warning::Notary secrets missing (need MAC_NOTARY_APPLE_ID/TEAM_ID/PASSWORD) — shipping SIGNED but un-notarized."
            exit 0
          fi
          ditto -c -k --keepParent release/VibeFlow.app "$RUNNER_TEMP/notarize.zip"
          OUT="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$MAC_NOTARY_APPLE_ID" --team-id "$MAC_NOTARY_TEAM_ID" --password "$MAC_NOTARY_PASSWORD" \
            --output-format json --wait | tee "$OUT"
          SID=$(python3 -c "import json;print(json.load(open('$OUT')).get('id',''))" 2>/dev/null)
          STATUS=$(python3 -c "import json;print(json.load(open('$OUT')).get('status',''))" 2>/dev/null)
          echo "notarization: status='${STATUS:-unknown}' id='${SID:-none}'"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::warning::Notarization not Accepted (status='${STATUS:-auth/submit error}'). Detailed log below:"
            if [ -n "$SID" ]; then
              xcrun notarytool log "$SID" \
                --apple-id "$MAC_NOTARY_APPLE_ID" --team-id "$MAC_NOTARY_TEAM_ID" --password "$MAC_NOTARY_PASSWORD" || true
            fi
            echo "::warning::Shipping SIGNED but UN-notarized (usable; auto-update unaffected). Fix the cause above, then re-tag."
            exit 0
          fi
          xcrun stapler staple release/VibeFlow.app && echo "✓ notarized + stapled" \
            || echo "::warning::Notarization Accepted but staple failed (still shippable)."
          spctl -a -vvv -t exec release/VibeFlow.app || true

      - name: Zip the app (arch-labelled)
        run: |
          ditto -c -k --keepParent "release/VibeFlow.app" "VibeFlow-mac-${{ matrix.arch }}.zip"
          ls -lh "VibeFlow-mac-${{ matrix.arch }}.zip"

      - name: Upload build artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: VibeFlow-mac-${{ matrix.arch }}
          path: VibeFlow-mac-${{ matrix.arch }}.zip

      - name: Attach to the GitHub Release (on a mac-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VibeFlow-mac-${{ matrix.arch }}.zip
