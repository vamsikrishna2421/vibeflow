# ============================================================================
#  VibeFlow settings
#  ----------------------------------------------------------------------------
#  This is a plain text file. Edit it with any text editor (Notepad is fine),
#  save, then choose "Reload settings" from the VibeFlow tray menu.
#  Lines starting with '#' are comments and are ignored.
# ============================================================================

# ----------------------------------------------------------------------------
#  Speech model — turns your voice into text. Bigger = more accurate but slower.
# ----------------------------------------------------------------------------
model:
  # tiny | base | small | medium | large-v3
  #   tiny  = fastest, least accurate (good for old/slow laptops)
  #   base  = great everyday balance (default)
  #   small = noticeably more accurate, still fast on most machines
  #   medium / large-v3 = most accurate, needs a strong CPU or a GPU
  size: base

  # Language of your speech. "auto" detects it for you, or set a code such as
  # en (English), es (Spanish), fr (French), de (German), hi (Hindi)...
  language: auto

  # Where to run: auto | cpu | cuda
  #   auto picks your NVIDIA GPU if available, otherwise the CPU.
  device: auto

  # Numerical precision: auto | int8 | int8_float16 | float16 | float32
  #   Leave as auto unless you know you need something specific.
  compute_type: auto

# ----------------------------------------------------------------------------
#  Trigger — how you start dictating.
# ----------------------------------------------------------------------------
hotkey:
  # How you talk. For now VibeFlow is push-to-talk only — toggle on/off is
  # disabled while we focus on the core experience.
  #   push_to_talk = hold the key(s) below while speaking, release to transcribe.
  mode: push_to_talk

  # Hold these key(s) to talk. Combine multiple with '+'. Examples:
  #   ctrl+win   ctrl_r (right Ctrl)   alt_r   f8   caps_lock
  push_to_talk_key: ctrl+win

  # (Unused for now — toggle mode is disabled.)
  toggle_combo: ctrl+win

# ----------------------------------------------------------------------------
#  Output — where your dictated text goes.
# ----------------------------------------------------------------------------
output:
  # auto | type | clipboard
  #   auto      = type into the text box if one is focused, otherwise copy to
  #               the clipboard (recommended).
  #   type      = always type at the cursor.
  #   clipboard = always copy; you paste with Ctrl+V yourself.
  mode: auto

  # How text is inserted when typing: paste | keystroke
  #   paste     = uses the clipboard + Ctrl+V (fast, reliable, best for Unicode).
  #   keystroke = simulates each key (use only if paste misbehaves in an app).
  insertion: paste

  # After pasting, put whatever was on your clipboard back. Keep this on.
  restore_clipboard: true

  # Add a single space after inserted text so back-to-back dictations don't
  # run their words together.
  trailing_space: true

  # In "auto" mode, what to do when VibeFlow can't tell if a text box is
  # focused: clipboard (safe, recommended) | type
  auto_fallback: clipboard

# ----------------------------------------------------------------------------
#  Audio.
# ----------------------------------------------------------------------------
audio:
  sample_rate: 16000          # Whisper models expect 16000; leave as-is.
  input_device: default       # "default", or a device name fragment / number.
                              # See your devices: python -m vibeflow --list-devices
  min_seconds: 0.4            # Ignore accidental ultra-short recordings.
  max_seconds: 120            # Safety cap for a single recording.

# ----------------------------------------------------------------------------
#  Feedback.
# ----------------------------------------------------------------------------
feedback:
  sounds: true                # Short beep when recording starts / stops.
  notifications: true         # Small pop-up messages from the tray icon.
  overlay: true               # On-screen status pill (Listening / Transcribing / Done).

# ----------------------------------------------------------------------------
#  Text tidy-up applied to every transcript.
# ----------------------------------------------------------------------------
text:
  strip: true                 # Trim surrounding whitespace.
  capitalize_sentences: true  # Capitalise the start of each sentence (Stage-4 tidy-up).
  spoken_commands: true       # Say "new line" / "new paragraph" to insert breaks.
  capitalize_first: false     # Capitalise only the very first letter.
  remove_trailing_period: false  # Drop a trailing '.' (handy for chat apps).

  # Adaptive vocabulary — learns your names/jargon so they transcribe correctly.
  vocabulary: []              # seed terms, e.g. [Kubernetes, kubectl, Acme]; grows as you teach it.
  teach_back: true            # learn from your edits: just cut/copy the corrected text.

# ----------------------------------------------------------------------------
#  AI formatting (OPTIONAL) — "voice to text WITH AI".
#  Off by default = plain, fast voice-to-text. Turn this on to have a LOCAL LLM
#  clean up and format your dictation. Everything still stays on your computer.
#  Easiest: just pick a tier from the tray "AI formatting" menu — VibeFlow
#  installs the runtime and downloads the model for you (zero-touch).
#  Advanced:  scripts\run.ps1 --setup-ai fast   (or --check-ai)
# ----------------------------------------------------------------------------
ai:
  enabled: false                       # true = use the local LLM to format text
  provider: ollama                     # ollama (local)
  endpoint: http://127.0.0.1:11434     # where Ollama is listening
  model: qwen2.5:1.5b                  # benchmark winner; or qwen2.5:3b / gemma2:2b
  timeout: 20                          # seconds before giving up (falls back to plain)
  prompt: ""                          # empty = built-in formatting prompt
