# ============================================================================
#  VibeFlow settings
#  ----------------------------------------------------------------------------
#  This is a plain text file. Edit it with any text editor (Notepad is fine),
#  save, then choose "Reload settings" from the VibeFlow tray menu.
#  Lines starting with '#' are comments and are ignored.
# ============================================================================

# ----------------------------------------------------------------------------
#  Speech model — turns your voice into text. Bigger = more accurate but slower.
# ----------------------------------------------------------------------------
model:
  # small | medium  (medium recommended). Other sizes were removed from the menu.
  #   small  = fast, still accurate
  #   medium = most accurate (recommended)
  size: medium

  # Transcribe WHILE you speak (capped-segment streaming) so the paste is
  # near-instant on release instead of after you stop. On by default.
  streaming: true

  # Language of your speech. Defaults to English ("en"). Use "auto" to detect it
  # for you, or set a code such as es (Spanish), fr (French), de (German),
  # hi (Hindi)... (auto can misfire on short clips, so English is the default.)
  language: en

  # Where to run: auto | cpu | cuda
  #   auto picks your NVIDIA GPU if available, otherwise the CPU.
  device: auto

  # Numerical precision: auto | int8 | int8_float16 | float16 | float32
  #   Leave as auto unless you know you need something specific.
  compute_type: auto

# ----------------------------------------------------------------------------
#  Trigger — how you start dictating.
# ----------------------------------------------------------------------------
hotkey:
  # How you talk. For now VibeFlow is push-to-talk only — toggle on/off is
  # disabled while we focus on the core experience.
  #   push_to_talk = hold the key(s) below while speaking, release to transcribe.
  mode: push_to_talk

  # Hold these key(s) to talk. Combine multiple with '+'. Examples:
  #   ctrl+win   ctrl_r (right Ctrl)   alt_r   f8   caps_lock
  push_to_talk_key: ctrl+win

  # (Unused for now — toggle mode is disabled.)
  toggle_combo: ctrl+win

# ----------------------------------------------------------------------------
#  Output — where your dictated text goes.
# ----------------------------------------------------------------------------
output:
  # auto | type | clipboard
  #   auto      = type into the text box if one is focused, otherwise copy to
  #               the clipboard (recommended).
  #   type      = always type at the cursor.
  #   clipboard = always copy; you paste with Ctrl+V yourself.
  mode: auto

  # How text is inserted when typing: paste | keystroke
  #   paste     = uses the clipboard + Ctrl+V (fast, reliable, best for Unicode).
  #   keystroke = simulates each key (use only if paste misbehaves in an app).
  insertion: paste

  # After pasting, put whatever was on your clipboard back. Keep this on.
  restore_clipboard: true

  # Add a single space after inserted text so back-to-back dictations don't
  # run their words together.
  trailing_space: true

  # In "auto" mode, what to do when VibeFlow can't tell if a text box is
  # focused: clipboard (safe, recommended) | type
  auto_fallback: type

# ----------------------------------------------------------------------------
#  Audio.
# ----------------------------------------------------------------------------
audio:
  sample_rate: 16000          # Whisper models expect 16000; leave as-is.
  input_device: default       # "default", or a device name fragment / number.
                              # See your devices: python -m vibeflow --list-devices
  min_seconds: 0.4            # Ignore accidental ultra-short recordings.
  max_seconds: 120            # Safety cap for a single recording.

# ----------------------------------------------------------------------------
#  Feedback.
# ----------------------------------------------------------------------------
feedback:
  sounds: true                # Short beep when recording starts / stops.
  notifications: true         # Small pop-up messages from the tray icon.
  overlay: true               # On-screen status pill (Listening / Transcribing / Done).

# ----------------------------------------------------------------------------
#  Text tidy-up applied to every transcript.
# ----------------------------------------------------------------------------
text:
  strip: true                 # Trim surrounding whitespace.
  capitalize_sentences: true  # Capitalise the start of each sentence (Stage-4 tidy-up).
  spoken_commands: true       # Say "new line" / "new paragraph" to insert breaks.
  capitalize_first: false     # Capitalise only the very first letter.
  remove_trailing_period: false  # Drop a trailing '.' (handy for chat apps).
  # OPT-IN: remove vocalized fillers ("um", "uh"). Tiered: when AI formatting is
  # on, the local LLM removes them context-aware (keeps "er" in "metoprolol er",
  # "uh-huh", etc.); when AI is off, a conservative offline regex strips only the
  # unambiguous standalone cases. Off by default; recover the raw text from the
  # tray ("Copy last transcript (unedited)").
  strip_fillers: true
  fillers: []                 # Custom filler list; [] uses the built-in safe set.

  # Adaptive vocabulary — learns your names/jargon so they transcribe correctly.
  vocabulary: []              # seed terms, e.g. [Kubernetes, kubectl, Acme]; grows as you teach it.
  teach_back: true            # learn from your edits: just cut/copy the corrected text (offline).
  # OPT-IN: AI-powered learning. A local LLM reads your corrected text and picks
  # out the technical terms to remember — just copy the whole corrected line, no
  # need to select single words. Cost: one-time ~1.8 GB model download; ~2 GB RAM
  # ONLY while learning (freed when idle; runs only when you edit+copy a transcript).
  # Turn on via the tray "Adaptive learning (AI)" toggle or the installer checkbox.
  ai_learning: false
  teach_back_model: qwen2.5:3b  # model used for term extraction (3b is the sweet spot)
  # Personalize AI formatting to your style (ON by default — a core feature).
  # VibeFlow keeps a small, capped, LOCAL sample of your recent dictation and
  # periodically distils a short profile (your domain/sector and tone) that
  # nudges the AI formatter to write more like you. Takes effect when AI
  # formatting is on. View/clear it from the tray ("Personalized AI"). Nothing
  # leaves your computer; turn it off here or in the tray if you prefer.
  persona: true
  # OPT-IN troubleshooting: when on, VibeFlow writes the raw transcript and your
  # before/after correction text (truncated) to vibeflow.log so a specific
  # mis-hearing can be diagnosed. Off by default; it stores dictation snippets in
  # the log, so only turn it on while investigating something.
  debug_log: false
  # Per-app formatting: VibeFlow can adapt how it formats your dictation to the
  # app you're dictating into. Out of the box only true terminals and code
  # editors are kept exactly "as spoken" (so commands/code aren't reworded);
  # every other app is unchanged until you add a rule (or accept the one-click
  # Starter Pack offered in the tray). Each rule's outcome is one of:
  #   leave-as-spoken | professional | casual   (default = normal clean-up)
  modes:
    enabled: true
    rules: []          # e.g. - {match: {by: process, value: outlook.exe}, outcome: professional}
    starter_pack_offered: false
    deliver_hotkey: ctrl+shift+v   # "Deliver here" — only active while a dictation is pending
    deliver_on_ctrl_v: false       # opt-in: also deliver a pending dictation on Ctrl+V
    pending_timeout: 60            # seconds a no-focus dictation waits before it's discarded
  # Text snippets: say the phrase on the left, VibeFlow inserts the text on the
  # right. Empty by default. Matching is whole-phrase and case-insensitive.
  # Example:
  #   snippets:
  #     my email: you@example.com
  #     my address: 1 Main Street, Springfield
  snippets: {}
  # Dictation history (OPT-IN): keep a local, capped, searchable log of your
  # dictations. Off by default — nothing is stored until you enable it from the
  # tray. Stored only on this PC; clear it anytime.
  history:
    enabled: false
    max: 500

# ----------------------------------------------------------------------------
#  AI formatting (OPTIONAL) — "voice to text WITH AI".
#  Off by default = plain, fast voice-to-text. Turn this on to have a LOCAL LLM
#  clean up and format your dictation. Everything still stays on your computer.
#  Easiest: just pick a tier from the tray "AI formatting" menu — VibeFlow
#  installs the runtime and downloads the model for you (zero-touch).
#  Advanced:  scripts\run.ps1 --setup-ai fast   (or --check-ai)
# ----------------------------------------------------------------------------
ai:
  enabled: false                       # true = use the local LLM to format text
  provider: ollama                     # ollama (local)
  endpoint: http://127.0.0.1:11434     # where Ollama is listening
  model: qwen2.5:3b                    # keeps your exact words; qwen2.5:1.5b is faster but paraphrases
  timeout: 20                          # seconds before giving up (falls back to plain)
  prompt: ""                          # empty = built-in formatting prompt
